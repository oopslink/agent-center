<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>计划依赖与代码继承，是两条不同的链</title><desc>来源：正文与 P4 候选谱系分析；A/B/C 为说明符号。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  06</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">概念示意</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">计划依赖与代码继承，是两条不同的链</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">任务图向前推进，还需要核对后续候选是否包含已验证的修改。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文与 P4 候选谱系分析；A/B/C 为说明符号。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  06</text><text x="64" y="289.55" font-size="23" fill="#245DD8" text-anchor="start">工作安排 / PLAN</text><rect x="64" y="325" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="269" y="385.5" font-size="30" fill="#245DD8" text-anchor="middle">实现 A</text><line x1="489" y1="379" x2="576" y2="379" stroke="#245DD8" stroke-width="3"/><polygon points="576,379 565.4690092573155,384.75310646325045 565.4690092573155,373.24689353674955" fill="#245DD8"/><rect x="594" y="325" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="799" y="385.5" font-size="30" fill="#245DD8" text-anchor="middle">修复 B</text><line x1="1019" y1="379" x2="1106" y2="379" stroke="#245DD8" stroke-width="3"/><polygon points="1106,379 1095.4690092573155,384.75310646325045 1095.4690092573155,373.24689353674955" fill="#245DD8"/><rect x="1124" y="325" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="1329" y="385.5" font-size="30" fill="#245DD8" text-anchor="middle">复验 C</text><text x="64" y="564.55" font-size="23" fill="#087F79" text-anchor="start">成果继承 / ARTIFACT</text><rect x="64" y="600" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="269" y="660.5" font-size="30" fill="#087F79" text-anchor="middle">候选 A</text><line x1="489" y1="654" x2="576" y2="654" stroke="#087F79" stroke-width="3" stroke-dasharray="8 7"/><polygon points="576,654 565.4690092573155,659.7531064632504 565.4690092573155,648.2468935367496" fill="#087F79"/><rect x="594" y="600" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="799" y="660.5" font-size="30" fill="#087F79" text-anchor="middle">候选 B</text><line x1="1019" y1="654" x2="1106" y2="654" stroke="#087F79" stroke-width="3" stroke-dasharray="8 7"/><polygon points="1106,654 1095.4690092573155,659.7531064632504 1095.4690092573155,648.2468935367496" fill="#087F79"/><rect x="1124" y="600" width="410" height="108" rx="10" fill="white" stroke="#D8E1E8"/><text x="1329" y="660.5" font-size="30" fill="#087F79" text-anchor="middle">候选 C</text><text x="590" y="492.1" font-size="26" fill="#B84B36" text-anchor="start">依赖边不能证明代码已继承</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">需要两类证据</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">计划检查节点与依赖；成果检查版本、文件内容及验收要求。</text></svg>