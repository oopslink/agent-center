<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>不同层面的主张，需要不同层面的证据</title><desc>来源：项目规约、测试规约与正文反思；层级不是质量评分。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  08</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">方法建议</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">不同层面的主张，需要不同层面的证据</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">先说清楚准备证明什么，再选择验证方式。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：项目规约、测试规约与正文反思；层级不是质量评分。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  08</text><text x="64" y="272.4" font-size="24" fill="#536779" text-anchor="start">主张层面</text><text x="470" y="272.4" font-size="24" fill="#536779" text-anchor="start">需要核对的事实</text><text x="1080" y="272.4" font-size="24" fill="#536779" text-anchor="start">相应证据</text><rect x="64" y="325" width="1472" height="90" rx="8" fill="white" stroke="#D8E1E8"/><text x="88" y="376.8" font-size="28" fill="#245DD8" text-anchor="start">领域规则</text><text x="470" y="376.25" font-size="25" fill="#152C40" text-anchor="start">权限 / 状态转换 / 唯一写入者</text><text x="1080" y="376.25" font-size="25" fill="#087F79" text-anchor="start">单元与契约检查</text><rect x="64" y="435" width="1472" height="90" rx="8" fill="white" stroke="#D8E1E8"/><text x="88" y="486.8" font-size="28" fill="#245DD8" text-anchor="start">进程与并发</text><text x="470" y="486.25" font-size="25" fill="#152C40" text-anchor="start">重复启动 / 重连 / 资源释放</text><text x="1080" y="486.25" font-size="25" fill="#087F79" text-anchor="start">集成、race、故障注入</text><rect x="64" y="545" width="1472" height="90" rx="8" fill="white" stroke="#D8E1E8"/><text x="88" y="596.8" font-size="28" fill="#245DD8" text-anchor="start">用户路径</text><text x="470" y="596.25" font-size="25" fill="#152C40" text-anchor="start">任务到达 / 执行 / 结果可见</text><text x="1080" y="596.25" font-size="25" fill="#087F79" text-anchor="start">真实页面与运行轨迹</text><rect x="64" y="655" width="1472" height="90" rx="8" fill="white" stroke="#D8E1E8"/><text x="88" y="706.8" font-size="28" fill="#245DD8" text-anchor="start">最终交付</text><text x="470" y="706.25" font-size="25" fill="#152C40" text-anchor="start">质量 / 成本 / 返工 / 人工介入</text><text x="1080" y="706.25" font-size="25" fill="#087F79" text-anchor="start">终态验收与同任务对照</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">测试全绿，应说明绿在哪一层</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">覆盖率不能替代用户路径证据；用户路径成功也不能单独证明成本收益。</text></svg>