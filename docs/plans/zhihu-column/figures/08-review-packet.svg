<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>把“帮我修好”变成可审查的任务</title><desc>来源：正文任务模板；非原始聊天记录，非真实产品截图。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  08</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">建议模板</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">把“帮我修好”变成可审查的任务</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">任务输入既给 Agent 行动空间，也给复核者明确的检查依据。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文任务模板；非原始聊天记录，非真实产品截图。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  08</text><rect x="64" y="260" width="1472" height="505" rx="12" fill="white" stroke="#D8E1E8"/><text x="94" y="309.95" font-size="27" fill="#245DD8" text-anchor="start">01 症状</text><text x="390" y="309.1" font-size="26" fill="#152C40" text-anchor="start">任务可运行，但没有活跃执行；附原始轨迹。</text><line x1="94" y1="351" x2="1500" y2="351" stroke="#D8E1E8" stroke-width="1"/><text x="94" y="403.95" font-size="27" fill="#245DD8" text-anchor="start">02 定位</text><text x="390" y="403.1" font-size="26" fill="#152C40" text-anchor="start">按门禁、通知、分派、启动逐段核对。</text><line x1="94" y1="445" x2="1500" y2="445" stroke="#D8E1E8" stroke-width="1"/><text x="94" y="497.95" font-size="27" fill="#245DD8" text-anchor="start">03 约束</text><text x="390" y="497.1" font-size="26" fill="#152C40" text-anchor="start">保持领域边界，防止重复创建执行。</text><line x1="94" y1="539" x2="1500" y2="539" stroke="#D8E1E8" stroke-width="1"/><text x="94" y="591.95" font-size="27" fill="#245DD8" text-anchor="start">04 输出</text><text x="390" y="591.1" font-size="26" fill="#152C40" text-anchor="start">解释根因、最小修改与仍未覆盖的路径。</text><line x1="94" y1="633" x2="1500" y2="633" stroke="#D8E1E8" stroke-width="1"/><text x="94" y="685.95" font-size="27" fill="#245DD8" text-anchor="start">05 验收</text><text x="390" y="685.1" font-size="26" fill="#152C40" text-anchor="start">复现原失败；提供修复后的对应证据。</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">审查的是主张与证据之间的对应关系</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">新增了多少代码、跑了多少条命令，都不能单独回答原问题是否得到解决。</text></svg>