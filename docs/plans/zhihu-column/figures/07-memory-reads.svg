<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>230 条读取回执，分布在哪些阶段？</title><desc>来源：P5 §4.2；按上下文、团队、commit 与规则去重的正文回执。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  07</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">数据对照</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">230 条读取回执，分布在哪些阶段？</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">12 名 Agent；按首次留存回执的阶段归类。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：P5 §4.2；按上下文、团队、commit 与规则去重的正文回执。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  07</text><line x1="510.0" y1="290" x2="510.0" y2="760" stroke="#D8E1E8" stroke-width="1"/><text x="510.0" y="792.85" font-size="21" fill="#536779" text-anchor="middle">0</text><line x1="727.5" y1="290" x2="727.5" y2="760" stroke="#D8E1E8" stroke-width="1"/><text x="727.5" y="792.85" font-size="21" fill="#536779" text-anchor="middle">35</text><line x1="945.0" y1="290" x2="945.0" y2="760" stroke="#D8E1E8" stroke-width="1"/><text x="945.0" y="792.85" font-size="21" fill="#536779" text-anchor="middle">70</text><line x1="1162.5" y1="290" x2="1162.5" y2="760" stroke="#D8E1E8" stroke-width="1"/><text x="1162.5" y="792.85" font-size="21" fill="#536779" text-anchor="middle">105</text><line x1="1380.0" y1="290" x2="1380.0" y2="760" stroke="#D8E1E8" stroke-width="1"/><text x="1380.0" y="792.85" font-size="21" fill="#536779" text-anchor="middle">140</text><text x="64" y="344.95" font-size="27" fill="#152C40" text-anchor="start">执行 execute</text><rect x="510" y="322" width="776.7857142857143" height="42" rx="3" fill="#087F79" stroke="none"/><text x="1302.7857142857142" y="347.4" font-size="24" fill="#087F79" text-anchor="start">125</text><text x="64" y="452.95" font-size="27" fill="#152C40" text-anchor="start">计划 plan</text><rect x="510" y="430" width="236.14285714285714" height="42" rx="3" fill="#087F79" stroke="none"/><text x="762.1428571428571" y="455.4" font-size="24" fill="#087F79" text-anchor="start">38</text><text x="64" y="560.95" font-size="27" fill="#152C40" text-anchor="start">审查 review</text><rect x="510" y="538" width="248.57142857142858" height="42" rx="3" fill="#087F79" stroke="none"/><text x="774.5714285714286" y="563.4" font-size="24" fill="#087F79" text-anchor="start">40</text><text x="64" y="668.95" font-size="27" fill="#152C40" text-anchor="start">恢复 recovery</text><rect x="510" y="646" width="167.78571428571428" height="42" rx="3" fill="#087F79" stroke="none"/><text x="693.7857142857142" y="671.4" font-size="24" fill="#087F79" text-anchor="start">27</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">读图边界</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">这不是全部调用次数，也不是采用率；各阶段缺少应用机会的共同分母。</text></svg>