<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>修改计划，提交的是一个完整的新状态</title><desc>来源：projectmanager/service/plan_topology_edit.go；省略存储适配细节。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  06</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">代码机制</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">修改计划，提交的是一个完整的新状态</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">批量编辑后检查最终图，同时防止旧版本覆盖与在途任务被撤回。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：projectmanager/service/plan_topology_edit.go；省略存储适配细节。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  06</text><rect x="64" y="300" width="332" height="305" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="300" width="5" height="305" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="335.3" font-size="18" fill="#245DD8" text-anchor="start">01</text><text x="89" y="383.5" font-size="30" fill="#152C40" text-anchor="start">读取基线</text><text x="89" y="431.4" font-size="24" fill="#536779" text-anchor="start">节点 / 边 / 分派</text><text x="89" y="467.4" font-size="24" fill="#536779" text-anchor="start">核对 base_version</text><line x1="404" y1="460" x2="432" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="432,460 421.4690092573155,465.75310646325045 421.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="444" y="300" width="332" height="305" rx="12" fill="white" stroke="#D8E1E8"/><rect x="444" y="300" width="5" height="305" rx="0" fill="#087F79" stroke="none"/><text x="469" y="335.3" font-size="18" fill="#087F79" text-anchor="start">02</text><text x="469" y="383.5" font-size="30" fill="#152C40" text-anchor="start">应用操作</text><text x="469" y="431.4" font-size="24" fill="#536779" text-anchor="start">在内存副本修改</text><text x="469" y="467.4" font-size="24" fill="#536779" text-anchor="start">不逐步提交半张图</text><line x1="784" y1="460" x2="812" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="812,460 801.4690092573155,465.75310646325045 801.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="824" y="300" width="332" height="305" rx="12" fill="white" stroke="#D8E1E8"/><rect x="824" y="300" width="5" height="305" rx="0" fill="#245DD8" stroke="none"/><text x="849" y="335.3" font-size="18" fill="#245DD8" text-anchor="start">03</text><text x="849" y="383.5" font-size="30" fill="#152C40" text-anchor="start">验证最终状态</text><text x="849" y="431.4" font-size="24" fill="#536779" text-anchor="start">同项目 / 无环</text><text x="849" y="467.4" font-size="24" fill="#536779" text-anchor="start">保护在途节点</text><line x1="1164" y1="460" x2="1192" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="1192,460 1181.4690092573155,465.75310646325045 1181.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="1204" y="300" width="332" height="305" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1204" y="300" width="5" height="305" rx="0" fill="#087F79" stroke="none"/><text x="1229" y="335.3" font-size="18" fill="#087F79" text-anchor="start">04</text><text x="1229" y="383.5" font-size="30" fill="#152C40" text-anchor="start">提交与推进</text><text x="1229" y="431.4" font-size="24" fill="#536779" text-anchor="start">一次事务写入</text><text x="1229" y="467.4" font-size="24" fill="#536779" text-anchor="start">继续计划执行</text><text x="64" y="713.8" font-size="28" fill="#B84B36" text-anchor="start">版本冲突：有人已经改过图</text><text x="824" y="713.8" font-size="28" fill="#B84B36" text-anchor="start">分派冲突：节点已经开始工作</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">结构合法，只是第一层保证</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">事务与图校验不能判断新计划是否更合理，也不能证明后续候选继承了旧成果。</text></svg>