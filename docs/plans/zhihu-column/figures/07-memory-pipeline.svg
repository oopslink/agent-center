<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>写入文件之后，记忆还要经过三道边界</title><desc>来源：memory/path.go、centergit producer/consumer 与 P5；反馈为评估要求。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  07</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">机制与检查</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">写入文件之后，记忆还要经过三道边界</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">保存、共享、读取与采用需要分别验证。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：memory/path.go、centergit producer/consumer 与 P5；反馈为评估要求。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  07</text><rect x="64" y="295" width="332" height="330" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="295" width="5" height="330" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="330.3" font-size="18" fill="#245DD8" text-anchor="start">01</text><text x="89" y="378.5" font-size="30" fill="#152C40" text-anchor="start">局部保存</text><text x="89" y="426.4" font-size="24" fill="#536779" text-anchor="start">任务 / 项目作用域</text><text x="89" y="462.4" font-size="24" fill="#536779" text-anchor="start">留下经验与来源</text><line x1="404" y1="460" x2="432" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="432,460 421.4690092573155,465.75310646325045 421.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="444" y="295" width="332" height="330" rx="12" fill="white" stroke="#D8E1E8"/><rect x="444" y="295" width="5" height="330" rx="0" fill="#245DD8" stroke="none"/><text x="469" y="330.3" font-size="18" fill="#245DD8" text-anchor="start">02</text><text x="469" y="378.5" font-size="30" fill="#152C40" text-anchor="start">团队发布</text><text x="469" y="426.4" font-size="24" fill="#536779" text-anchor="start">仓库 / 授权</text><text x="469" y="462.4" font-size="24" fill="#536779" text-anchor="start">记录版本与变更</text><line x1="784" y1="460" x2="812" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="812,460 801.4690092573155,465.75310646325045 801.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="824" y="295" width="332" height="330" rx="12" fill="white" stroke="#D8E1E8"/><rect x="824" y="295" width="5" height="330" rx="0" fill="#245DD8" stroke="none"/><text x="849" y="330.3" font-size="18" fill="#245DD8" text-anchor="start">03</text><text x="849" y="378.5" font-size="30" fill="#152C40" text-anchor="start">读取快照</text><text x="849" y="426.4" font-size="24" fill="#536779" text-anchor="start">阶段 / commit</text><text x="849" y="462.4" font-size="24" fill="#536779" text-anchor="start">知道本次读了什么</text><line x1="1164" y1="460" x2="1192" y2="460" stroke="#245DD8" stroke-width="3"/><polygon points="1192,460 1181.4690092573155,465.75310646325045 1181.4690092573155,454.24689353674955" fill="#245DD8"/><rect x="1204" y="295" width="332" height="330" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1204" y="295" width="5" height="330" rx="0" fill="#087F79" stroke="none"/><text x="1229" y="330.3" font-size="18" fill="#087F79" text-anchor="start">04</text><text x="1229" y="378.5" font-size="30" fill="#152C40" text-anchor="start">行为核对</text><text x="1229" y="426.4" font-size="24" fill="#536779" text-anchor="start">适用当前任务？</text><text x="1229" y="462.4" font-size="24" fill="#536779" text-anchor="start">实际采取什么动作？</text><text x="64" y="727.2" font-size="32" fill="#B84B36" text-anchor="start">文件存在 ≠ 已经共享 ≠ 本次读到 ≠ 正确采用</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">稳定快照与及时更新需要取舍</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">运行中的执行者可能保留旧快照；应按加载、恢复与新建执行的约定核对。</text></svg>