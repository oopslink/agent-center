<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>一次委派如何交回同一个负责人</title><desc>来源：正文所列代码与设计记录；示意图不代表运行测量。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  03</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">机制示意</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">一次委派如何交回同一个负责人</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">临时执行可以结束；任务的剩余交付义务仍需要有人接住。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文所列代码与设计记录；示意图不代表运行测量。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  03</text><rect x="110" y="245" width="260" height="64" rx="8" fill="#EDF3FA" stroke="none"/><text x="240" y="285.95" font-size="27" fill="#245DD8" text-anchor="middle">任务系统</text><line x1="240" y1="325" x2="240" y2="780" stroke="#D8E1E8" stroke-width="2" stroke-dasharray="8 7"/><rect x="670" y="245" width="260" height="64" rx="8" fill="#EDF3FA" stroke="none"/><text x="800" y="285.95" font-size="27" fill="#245DD8" text-anchor="middle">Supervisor</text><line x1="800" y1="325" x2="800" y2="780" stroke="#D8E1E8" stroke-width="2" stroke-dasharray="8 7"/><rect x="1230" y="245" width="260" height="64" rx="8" fill="#EDF3FA" stroke="none"/><text x="1360" y="285.95" font-size="27" fill="#245DD8" text-anchor="middle">Executor</text><line x1="1360" y1="325" x2="1360" y2="780" stroke="#D8E1E8" stroke-width="2" stroke-dasharray="8 7"/><line x1="240" y1="380" x2="800" y2="380" stroke="#245DD8" stroke-width="3"/><polygon points="800,380 789.4690092573155,385.75310646325045 789.4690092573155,374.24689353674955" fill="#245DD8"/><text x="520.0" y="358.7" font-size="22" fill="#245DD8" text-anchor="middle">通知有工作</text><line x1="800" y1="485" x2="1360" y2="485" stroke="#245DD8" stroke-width="3"/><polygon points="1360,485 1349.4690092573155,490.75310646325045 1349.4690092573155,479.24689353674955" fill="#245DD8"/><text x="1080.0" y="463.7" font-size="22" fill="#245DD8" text-anchor="middle">选择模型，创建执行</text><line x1="1360" y1="610" x2="800" y2="610" stroke="#087F79" stroke-width="3"/><polygon points="800,610 810.5309907426845,604.2468935367496 810.5309907426845,615.7531064632504" fill="#087F79"/><text x="1080.0" y="588.7" font-size="22" fill="#087F79" text-anchor="middle">返回候选 / 失败 / 验收缺口</text><line x1="800" y1="735" x2="240" y2="735" stroke="#087F79" stroke-width="3"/><polygon points="240,735 250.53099074268448,729.2468935367496 250.53099074268448,740.7531064632504" fill="#087F79"/><text x="520.0" y="713.7" font-size="22" fill="#087F79" text-anchor="middle">判断结果，继续推进任务</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">模型选择与责任交接是两项决定</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">选谁执行，决定执行成本；怎样接回结果，决定目标能否真正交付。</text></svg>