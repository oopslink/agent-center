<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>一次可复核的修改，怎样形成闭环</title><desc>来源：项目 doc-first / 领域边界 / 测试规约；流程为正文归纳。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  08</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">开发实践</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">一次可复核的修改，怎样形成闭环</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">从具体症状开始，经实现与证据返回原问题。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：项目 doc-first / 领域边界 / 测试规约；流程为正文归纳。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  08</text><rect x="64" y="270" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="270" width="5" height="210" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="305.3" font-size="18" fill="#245DD8" text-anchor="start">01</text><text x="89" y="353.5" font-size="30" fill="#152C40" text-anchor="start">现场问题</text><text x="89" y="401.4" font-size="24" fill="#536779" text-anchor="start">保存症状与失败轨迹</text><rect x="574" y="270" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="574" y="270" width="5" height="210" rx="0" fill="#245DD8" stroke="none"/><text x="599" y="305.3" font-size="18" fill="#245DD8" text-anchor="start">02</text><text x="599" y="353.5" font-size="30" fill="#152C40" text-anchor="start">设计边界</text><text x="599" y="401.4" font-size="24" fill="#536779" text-anchor="start">明确谁负责、什么不能改</text><rect x="1084" y="270" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1084" y="270" width="5" height="210" rx="0" fill="#245DD8" stroke="none"/><text x="1109" y="305.3" font-size="18" fill="#245DD8" text-anchor="start">03</text><text x="1109" y="353.5" font-size="30" fill="#152C40" text-anchor="start">小步实现</text><text x="1109" y="401.4" font-size="24" fill="#536779" text-anchor="start">把改动限制为可验收单元</text><rect x="1084" y="565" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1084" y="565" width="5" height="210" rx="0" fill="#087F79" stroke="none"/><text x="1109" y="600.3" font-size="18" fill="#087F79" text-anchor="start">04</text><text x="1109" y="648.5" font-size="30" fill="#152C40" text-anchor="start">运行验证</text><text x="1109" y="696.4" font-size="24" fill="#536779" text-anchor="start">核对原路径与关键风险</text><rect x="574" y="565" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="574" y="565" width="5" height="210" rx="0" fill="#087F79" stroke="none"/><text x="599" y="600.3" font-size="18" fill="#087F79" text-anchor="start">05</text><text x="599" y="648.5" font-size="30" fill="#152C40" text-anchor="start">证据复核</text><text x="599" y="696.4" font-size="24" fill="#536779" text-anchor="start">代码、日志、页面相互对应</text><rect x="64" y="565" width="452" height="210" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="565" width="5" height="210" rx="0" fill="#087F79" stroke="none"/><text x="89" y="600.3" font-size="18" fill="#087F79" text-anchor="start">06</text><text x="89" y="648.5" font-size="30" fill="#152C40" text-anchor="start">人作裁决</text><text x="89" y="696.4" font-size="24" fill="#536779" text-anchor="start">完成 / 修正 / 否决方案</text><line x1="526" y1="375" x2="564" y2="375" stroke="#245DD8" stroke-width="3"/><polygon points="564,375 553.4690092573155,380.75310646325045 553.4690092573155,369.24689353674955" fill="#245DD8"/><line x1="1036" y1="375" x2="1074" y2="375" stroke="#245DD8" stroke-width="3"/><polygon points="1074,375 1063.4690092573155,380.75310646325045 1063.4690092573155,369.24689353674955" fill="#245DD8"/><line x1="1310" y1="490" x2="1310" y2="555" stroke="#245DD8" stroke-width="3"/><polygon points="1310,555 1304.2468935367497,544.4690092573155 1315.7531064632503,544.4690092573155" fill="#245DD8"/><line x1="1074" y1="670" x2="1036" y2="670" stroke="#087F79" stroke-width="3"/><polygon points="1036,670 1046.5309907426845,664.2468935367496 1046.5309907426845,675.7531064632504" fill="#087F79"/><line x1="564" y1="670" x2="526" y2="670" stroke="#087F79" stroke-width="3"/><polygon points="526,670 536.5309907426845,664.2468935367496 536.5309907426845,675.7531064632504" fill="#087F79"/><line x1="64" y1="670" x2="36" y2="670" stroke="#087F79" stroke-width="2" stroke-dasharray="8 7"/><line x1="36" y1="670" x2="36" y2="375" stroke="#087F79" stroke-width="2" stroke-dasharray="8 7"/><line x1="36" y1="375" x2="64" y2="375" stroke="#087F79" stroke-width="3" stroke-dasharray="8 7"/><polygon points="64,375 53.46900925731553,380.75310646325045 53.46900925731553,369.24689353674955" fill="#087F79"/><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">Agent 可以推进实现，人保留关键裁决</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">对领域边界、证据标准和最终完成条件的判断，必须在开发过程中持续可见。</text></svg>