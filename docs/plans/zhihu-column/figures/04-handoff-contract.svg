<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>一次可核验的交接，需要交出什么</title><desc>来源：P2 回执认可案例与正文建议；字段示意，不是现有页面截图。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  04</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">协议建议</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">一次可核验的交接，需要交出什么</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">建议的交接结构：让接收者能判断是否沿用证据、是否需要重跑。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：P2 回执认可案例与正文建议；字段示意，不是现有页面截图。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  04</text><rect x="64" y="265" width="380" height="470" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="265" width="5" height="470" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="300.3" font-size="18" fill="#245DD8" text-anchor="start">发送方</text><text x="89" y="348.5" font-size="30" fill="#152C40" text-anchor="start">完成本环节</text><text x="89" y="396.4" font-size="24" fill="#536779" text-anchor="start">固定候选版本</text><text x="89" y="432.4" font-size="24" fill="#536779" text-anchor="start">整理检查产物</text><text x="89" y="468.4" font-size="24" fill="#536779" text-anchor="start">指出未完成要求</text><rect x="510" y="265" width="580" height="470" rx="12" fill="white" stroke="#D8E1E8"/><text x="542" y="316.8" font-size="28" fill="#087F79" text-anchor="start">交接包 / HANDOFF</text><text x="542" y="380.4" font-size="24" fill="#087F79" text-anchor="start">候选</text><text x="710" y="380.4" font-size="24" fill="#152C40" text-anchor="start">哪一版代码 / commit</text><line x1="542" y1="410" x2="1058" y2="410" stroke="#D8E1E8" stroke-width="1"/><text x="542" y="462.4" font-size="24" fill="#087F79" text-anchor="start">依据</text><text x="710" y="462.4" font-size="24" fill="#152C40" text-anchor="start">哪份需求 / 验收要求</text><line x1="542" y1="492" x2="1058" y2="492" stroke="#D8E1E8" stroke-width="1"/><text x="542" y="544.4" font-size="24" fill="#087F79" text-anchor="start">证据</text><text x="710" y="544.4" font-size="24" fill="#152C40" text-anchor="start">命令、结果、产物位置</text><line x1="542" y1="574" x2="1058" y2="574" stroke="#D8E1E8" stroke-width="1"/><text x="542" y="626.4" font-size="24" fill="#087F79" text-anchor="start">剩余义务</text><text x="710" y="626.4" font-size="24" fill="#152C40" text-anchor="start">还差什么 / 谁继续</text><line x1="542" y1="656" x2="1058" y2="656" stroke="#D8E1E8" stroke-width="1"/><rect x="1156" y="265" width="380" height="470" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1156" y="265" width="5" height="470" rx="0" fill="#245DD8" stroke="none"/><text x="1181" y="300.3" font-size="18" fill="#245DD8" text-anchor="start">接收方</text><text x="1181" y="348.5" font-size="30" fill="#152C40" text-anchor="start">作出下一步判断</text><text x="1181" y="396.4" font-size="24" fill="#536779" text-anchor="start">确认候选一致</text><text x="1181" y="432.4" font-size="24" fill="#536779" text-anchor="start">确认检查适用</text><text x="1181" y="468.4" font-size="24" fill="#536779" text-anchor="start">沿用证据或补查</text><line x1="452" y1="490" x2="500" y2="490" stroke="#245DD8" stroke-width="3"/><polygon points="500,490 489.4690092573155,495.75310646325045 489.4690092573155,484.24689353674955" fill="#245DD8"/><line x1="1100" y1="490" x2="1146" y2="490" stroke="#245DD8" stroke-width="3"/><polygon points="1146,490 1135.4690092573155,495.75310646325045 1135.4690092573155,484.24689353674955" fill="#245DD8"/><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">需要共享的是可核验的事实</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">仅传递“我做完了”或“测试通过”，不足以支持下一环节的判断。</text></svg>