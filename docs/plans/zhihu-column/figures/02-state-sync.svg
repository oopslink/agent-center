<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>旧模型的维护成本，出现在双向联动中</title><desc>来源：2b6af1de 的 work_item_projector.go 与 task_status_sync_projector.go。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  02</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">历史机制</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">旧模型的维护成本，出现在双向联动中</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">不同状态有其语义；复杂度来自跨模型转换需要同步裁决。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：2b6af1de 的 work_item_projector.go 与 task_status_sync_projector.go。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  02</text><rect x="64" y="260" width="420" height="380" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="260" width="5" height="380" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="295.3" font-size="18" fill="#245DD8" text-anchor="start">PROJECT MANAGEMENT</text><text x="89" y="343.5" font-size="30" fill="#152C40" text-anchor="start">Task</text><text x="89" y="391.4" font-size="24" fill="#536779" text-anchor="start">分配 / 转派</text><text x="89" y="427.4" font-size="24" fill="#536779" text-anchor="start">开始 / 完成</text><text x="89" y="463.4" font-size="24" fill="#536779" text-anchor="start">失败后的业务阻塞</text><rect x="1116" y="260" width="420" height="380" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1116" y="260" width="5" height="380" rx="0" fill="#087F79" stroke="none"/><text x="1141" y="295.3" font-size="18" fill="#087F79" text-anchor="start">AGENT</text><text x="1141" y="343.5" font-size="30" fill="#152C40" text-anchor="start">WorkItem</text><text x="1141" y="391.4" font-size="24" fill="#536779" text-anchor="start">创建 / 取代旧项</text><text x="1141" y="427.4" font-size="24" fill="#536779" text-anchor="start">激活 / 结束</text><text x="1141" y="463.4" font-size="24" fill="#536779" text-anchor="start">等待 / 失败</text><line x1="500" y1="350" x2="1100" y2="350" stroke="#245DD8" stroke-width="3"/><polygon points="1100,350 1089.4690092573155,355.75310646325045 1089.4690092573155,344.24689353674955" fill="#245DD8"/><text x="800.0" y="328.7" font-size="22" fill="#245DD8" text-anchor="middle">分配 / 转派 → 更新工作项</text><line x1="1100" y1="535" x2="500" y2="535" stroke="#087F79" stroke-width="3"/><polygon points="500,535 510.5309907426845,529.2468935367496 510.5309907426845,540.7531064632504" fill="#087F79"/><text x="800.0" y="513.7" font-size="22" fill="#087F79" text-anchor="middle">激活 / 失败 → 推进任务</text><rect x="548" y="616" width="504" height="145" rx="10" fill="#FAEEE9" stroke="none"/><text x="575" y="657.25" font-size="25" fill="#B84B36" text-anchor="start">同一个“Task 完成”事件</text><text x="575" y="700.55" font-size="23" fill="#152C40" text-anchor="start">active → done</text><text x="575" y="735.05" font-size="23" fill="#152C40" text-anchor="start">queued / waiting_input → canceled</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#FAEEE9" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#B84B36" text-anchor="start">幂等并不替代业务规则</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">事件重复消费可以被防护；两套状态机的合法映射仍需要单独定义和维护。</text></svg>