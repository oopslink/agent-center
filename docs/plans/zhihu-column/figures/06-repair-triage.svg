<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>任务未完成，先分清缺的是哪一种东西</title><desc>来源：正文反思与 P4 观察；尚未用实验验证此检查流程的收益。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  06</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">方法建议</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">任务未完成，先分清缺的是哪一种东西</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">修复前的建议检查：避免把材料交接问题再次变成代码开发。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文反思与 P4 观察；尚未用实验验证此检查流程的收益。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  06</text><rect x="64" y="275" width="1472" height="132" rx="10" fill="white" stroke="#D8E1E8"/><text x="92" y="322.65" font-size="29" fill="#245DD8" text-anchor="start">实现行为错误</text><line x1="530" y1="341" x2="620" y2="341" stroke="#245DD8" stroke-width="3"/><polygon points="620,341 609.4690092573155,346.75310646325045 609.4690092573155,335.24689353674955" fill="#245DD8"/><text x="660" y="322.65" font-size="29" fill="#087F79" text-anchor="start">安排代码修复</text><text x="1040" y="324.25" font-size="25" fill="#536779" text-anchor="start">修复后重验相关行为</text><rect x="64" y="445" width="1472" height="132" rx="10" fill="white" stroke="#D8E1E8"/><text x="92" y="492.65" font-size="29" fill="#245DD8" text-anchor="start">实现正确，缺少复验</text><line x1="530" y1="511" x2="620" y2="511" stroke="#245DD8" stroke-width="3"/><polygon points="620,511 609.4690092573155,516.7531064632504 609.4690092573155,505.24689353674955" fill="#245DD8"/><text x="660" y="492.65" font-size="29" fill="#087F79" text-anchor="start">复验原候选</text><text x="1040" y="494.25" font-size="25" fill="#536779" text-anchor="start">固定版本，补齐所缺检查</text><rect x="64" y="615" width="1472" height="132" rx="10" fill="white" stroke="#D8E1E8"/><text x="92" y="662.65" font-size="29" fill="#245DD8" text-anchor="start">检查通过，接收者读不到</text><line x1="530" y1="681" x2="620" y2="681" stroke="#245DD8" stroke-width="3"/><polygon points="620,681 609.4690092573155,686.7531064632504 609.4690092573155,675.2468935367496" fill="#245DD8"/><text x="660" y="662.65" font-size="29" fill="#087F79" text-anchor="start">修复证据交接</text><text x="1040" y="664.25" font-size="25" fill="#536779" text-anchor="start">补位置、权限与适用说明</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">先解释新增工作的必要性</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">每次改图应对应一个明确的交付缺口，并说明为什么已有成果不足以填补它。</text></svg>