<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>模型选择：按代码中的回退顺序读取</title><desc>来源：Router.ResolveExecutor / Judge / executor_runtime；细节见正文源码链接。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  03</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">代码分支</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">模型选择：按代码中的回退顺序读取</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">智能判断是可选分支；配置与确定性回退同样决定最终结果。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：Router.ResolveExecutor / Judge / executor_runtime；细节见正文源码链接。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  03</text><circle cx="95" cy="278" r="25" fill="#245DD8"/><text x="95" y="283.25" font-size="25" fill="white" text-anchor="middle">1</text><text x="150" y="280.8" font-size="28" fill="#152C40" text-anchor="start">任务指定</text><text x="405" y="280.4" font-size="24" fill="#536779" text-anchor="start">Task 明确指定模型；存在候选池时需匹配</text><line x1="95" y1="308" x2="95" y2="331" stroke="#D8E1E8" stroke-width="2"/><circle cx="95" cy="386" r="25" fill="#087F79"/><text x="95" y="391.25" font-size="25" fill="white" text-anchor="middle">2</text><text x="150" y="388.8" font-size="28" fill="#152C40" text-anchor="start">可选判断</text><text x="405" y="388.4" font-size="24" fill="#536779" text-anchor="start">Judge 启用且候选池非空：结合能力与价格选择</text><line x1="95" y1="416" x2="95" y2="439" stroke="#D8E1E8" stroke-width="2"/><circle cx="95" cy="494" r="25" fill="#245DD8"/><text x="95" y="499.25" font-size="25" fill="white" text-anchor="middle">3</text><text x="150" y="496.8" font-size="28" fill="#152C40" text-anchor="start">默认配置</text><text x="405" y="496.4" font-size="24" fill="#536779" text-anchor="start">default_executor_model；未配置时参考 orchestrator_model</text><line x1="95" y1="524" x2="95" y2="547" stroke="#D8E1E8" stroke-width="2"/><circle cx="95" cy="602" r="25" fill="#245DD8"/><text x="95" y="607.25" font-size="25" fill="white" text-anchor="middle">4</text><text x="150" y="604.8" font-size="28" fill="#152C40" text-anchor="start">候选回退</text><text x="405" y="604.4" font-size="24" fill="#536779" text-anchor="start">候选池首项提供确定性的可用选择</text><line x1="95" y1="632" x2="95" y2="655" stroke="#D8E1E8" stroke-width="2"/><circle cx="95" cy="710" r="25" fill="#245DD8"/><text x="95" y="715.25" font-size="25" fill="white" text-anchor="middle">5</text><text x="150" y="712.8" font-size="28" fill="#152C40" text-anchor="start">最终回退</text><text x="405" y="712.4" font-size="24" fill="#536779" text-anchor="start">Supervisor 自身模型；仍无法解析则报告错误</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#FAEEE9" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#B84B36" text-anchor="start">判断开关默认关闭</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">实现了模型选择机制，不等于已经证明它达到了最低成本或最佳效果。</text></svg>