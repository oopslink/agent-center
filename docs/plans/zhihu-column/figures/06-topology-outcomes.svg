<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>改图与任务完成：观察到的是共现</title><desc>来源：P4 表 5a；169 次父子快照转移，不是随机分组实验。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  06</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">观察数据</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">改图与任务完成：观察到的是共现</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">每行按自身样本量归一化；两组数量相差很大，不能直接比较改图收益。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：P4 表 5a；169 次父子快照转移，不是随机分组实验。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  06</text><text x="64" y="340.5" font-size="30" fill="#152C40" text-anchor="start">节点或边改变</text><text x="64" y="386.4" font-size="24" fill="#536779" text-anchor="start">n = 166 次转移</text><rect x="540" y="315" width="590.1807228915662" height="65" rx="0" fill="#087F79" stroke="none"/><rect x="1130.1807228915663" y="315" width="379.81927710843377" height="65" rx="0" fill="#DCE4EB" stroke="none"/><text x="540" y="426.25" font-size="25" fill="#087F79" text-anchor="start">共有任务转完成：101 次</text><text x="1510" y="426.25" font-size="25" fill="#536779" text-anchor="end">其余：65 次</text><text x="64" y="580.5" font-size="30" fill="#152C40" text-anchor="start">拓扑保持原样</text><text x="64" y="626.4" font-size="24" fill="#536779" text-anchor="start">n = 3 次转移</text><rect x="540" y="555" width="323.3333333333333" height="65" rx="0" fill="#087F79" stroke="none"/><rect x="863.3333333333333" y="555" width="646.6666666666667" height="65" rx="0" fill="#DCE4EB" stroke="none"/><text x="540" y="666.25" font-size="25" fill="#087F79" text-anchor="start">共有任务转完成：1 次</text><text x="1510" y="666.25" font-size="25" fill="#536779" text-anchor="end">其余：2 次</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#FAEEE9" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#B84B36" text-anchor="start">不把相关变化写成因果收益</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">同一区间可能发生复验、转派等操作；完成字段也不等于重新验收后的交付。</text></svg>