<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>缺少阶段限定，正确规则也会阻断交接</title><desc>来源：P5 宽泛 main 规则案例；图为因果关系概括，不是逐条原始事件。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  07</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">案例机制</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">缺少阶段限定，正确规则也会阻断交接</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">示例规则：“完成前必须合入 main”；候选交接却是独立验收的前提。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：P5 宽泛 main 规则案例；图为因果关系概括，不是逐条原始事件。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  07</text><rect x="64" y="280" width="640" height="240" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="280" width="5" height="240" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="315.3" font-size="18" fill="#245DD8" text-anchor="start">开发环节</text><text x="89" y="363.5" font-size="30" fill="#152C40" text-anchor="start">先交出可验收的候选</text><text x="89" y="411.4" font-size="24" fill="#536779" text-anchor="start">交接完成后，测试者才能开始</text><rect x="896" y="280" width="640" height="240" rx="12" fill="white" stroke="#D8E1E8"/><rect x="896" y="280" width="5" height="240" rx="0" fill="#087F79" stroke="none"/><text x="921" y="315.3" font-size="18" fill="#087F79" text-anchor="start">验收与集成</text><text x="921" y="363.5" font-size="30" fill="#152C40" text-anchor="start">先独立验收，再合入 main</text><text x="921" y="411.4" font-size="24" fill="#536779" text-anchor="start">候选尚未交接，后续无法开始</text><line x1="720" y1="380" x2="880" y2="380" stroke="#245DD8" stroke-width="3"/><polygon points="880,380 869.4690092573155,385.75310646325045 869.4690092573155,374.24689353674955" fill="#245DD8"/><text x="800.0" y="358.7" font-size="22" fill="#245DD8" text-anchor="middle">依赖</text><line x1="1216" y1="520" x2="1216" y2="670" stroke="#B84B36" stroke-width="2"/><line x1="1216" y1="670" x2="384" y2="670" stroke="#B84B36" stroke-width="3"/><polygon points="384,670 394.5309907426845,664.2468935367496 394.5309907426845,675.7531064632504" fill="#B84B36"/><line x1="384" y1="670" x2="384" y2="520" stroke="#B84B36" stroke-width="2"/><text x="800" y="732.95" font-size="27" fill="#B84B36" text-anchor="middle">无条件规则要求先合入，反过来拦住候选交接</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">限定到最终集成阶段</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">中间环节交出固定、可访问的候选与必要证据；最终交付再执行合入门禁。</text></svg>