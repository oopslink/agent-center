<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>先筛当前问题，再决定读哪些历史</title><desc>来源：正文情境；A/B 为假设版本，图中筛选步骤是设计建议。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  05</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">说明性示例</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">先筛当前问题，再决定读哪些历史</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">说明例：当前要验收候选 B，手里却有候选 A 的绿色报告。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文情境；A/B 为假设版本，图中筛选步骤是设计建议。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  05</text><rect x="64" y="290" width="455" height="440" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="290" width="5" height="440" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="325.3" font-size="18" fill="#245DD8" text-anchor="start">材料来源</text><text x="89" y="373.5" font-size="30" fill="#152C40" text-anchor="start">两份记录</text><text x="89" y="421.4" font-size="24" fill="#536779" text-anchor="start">同角色 Tester：</text><text x="89" y="457.4" font-size="24" fill="#536779" text-anchor="start">候选 A，检查通过</text><text x="89" y="493.4" font-size="24" fill="#536779" text-anchor="start"></text><text x="89" y="529.4" font-size="24" fill="#536779" text-anchor="start">跨角色开发者：</text><text x="89" y="565.4" font-size="24" fill="#536779" text-anchor="start">候选 B，检查失败</text><rect x="584" y="290" width="432" height="440" rx="12" fill="white" stroke="#D8E1E8"/><rect x="584" y="290" width="5" height="440" rx="0" fill="#087F79" stroke="none"/><text x="609" y="325.3" font-size="18" fill="#087F79" text-anchor="start">选择条件</text><text x="609" y="373.5" font-size="30" fill="#152C40" text-anchor="start">对当前判断是否适用</text><text x="609" y="421.4" font-size="24" fill="#536779" text-anchor="start">① 是否有权读取</text><text x="609" y="457.4" font-size="24" fill="#536779" text-anchor="start">② 是否对应候选 B</text><text x="609" y="493.4" font-size="24" fill="#536779" text-anchor="start">③ 是否覆盖本轮要求</text><text x="609" y="529.4" font-size="24" fill="#536779" text-anchor="start">④ 是否仍然有效</text><rect x="1081" y="290" width="455" height="440" rx="12" fill="white" stroke="#D8E1E8"/><rect x="1081" y="290" width="5" height="440" rx="0" fill="#B84B36" stroke="none"/><text x="1106" y="325.3" font-size="18" fill="#B84B36" text-anchor="start">判断依据</text><text x="1106" y="373.5" font-size="30" fill="#152C40" text-anchor="start">当前失败必须可见</text><text x="1106" y="421.4" font-size="24" fill="#536779" text-anchor="start">只读同角色历史</text><text x="1106" y="457.4" font-size="24" fill="#536779" text-anchor="start">可能留下旧的绿色报告</text><text x="1106" y="493.4" font-size="24" fill="#536779" text-anchor="start"></text><text x="1106" y="529.4" font-size="24" fill="#536779" text-anchor="start">按任务与版本选材料</text><text x="1106" y="565.4" font-size="24" fill="#536779" text-anchor="start">才能解释 B 的具体缺口</text><line x1="530" y1="490" x2="572" y2="490" stroke="#245DD8" stroke-width="3"/><polygon points="572,490 561.4690092573155,495.75310646325045 561.4690092573155,484.24689353674955" fill="#245DD8"/><line x1="1027" y1="490" x2="1069" y2="490" stroke="#245DD8" stroke-width="3"/><polygon points="1069,490 1058.4690092573155,495.75310646325045 1058.4690092573155,484.24689353674955" fill="#245DD8"/><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">角色相同，不保证信息充分</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">选择单位应是当前判断所需的证据，并始终受权限约束。</text></svg>