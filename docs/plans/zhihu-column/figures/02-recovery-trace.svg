<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>“进行中”卡住时，沿责任链寻找断点</title><desc>来源：正文所列代码与设计记录；示意图不代表运行测量。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  02</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">诊断路径</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">“进行中”卡住时，沿责任链寻找断点</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">排障示意：先确认事实，再判断下一步由谁驱动。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文所列代码与设计记录；示意图不代表运行测量。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  02</text><circle cx="90" cy="318" r="24" fill="#245DD8"/><text x="90" y="322.55" font-size="23" fill="white" text-anchor="middle">1</text><text x="64" y="392.95" font-size="27" fill="#152C40" text-anchor="start">任务可运行？</text><text x="64" y="441.7" font-size="22" fill="#536779" text-anchor="start">状态 / 依赖</text><line x1="134" y1="318" x2="342" y2="318" stroke="#245DD8" stroke-width="3"/><polygon points="342,318 331.4690092573155,323.75310646325045 331.4690092573155,312.24689353674955" fill="#245DD8"/><circle cx="390" cy="318" r="24" fill="#245DD8"/><text x="390" y="322.55" font-size="23" fill="white" text-anchor="middle">2</text><text x="364" y="392.95" font-size="27" fill="#152C40" text-anchor="start">通知已送达？</text><text x="364" y="441.7" font-size="22" fill="#536779" text-anchor="start">唤醒 / 注入</text><line x1="434" y1="318" x2="642" y2="318" stroke="#245DD8" stroke-width="3"/><polygon points="642,318 631.4690092573155,323.75310646325045 631.4690092573155,312.24689353674955" fill="#245DD8"/><circle cx="690" cy="318" r="24" fill="#245DD8"/><text x="690" y="322.55" font-size="23" fill="white" text-anchor="middle">3</text><text x="664" y="392.95" font-size="27" fill="#152C40" text-anchor="start">已作出分派？</text><text x="664" y="441.7" font-size="22" fill="#536779" text-anchor="start">Supervisor 决定</text><line x1="734" y1="318" x2="942" y2="318" stroke="#245DD8" stroke-width="3"/><polygon points="942,318 931.4690092573155,323.75310646325045 931.4690092573155,312.24689353674955" fill="#245DD8"/><circle cx="990" cy="318" r="24" fill="#245DD8"/><text x="990" y="322.55" font-size="23" fill="white" text-anchor="middle">4</text><text x="964" y="392.95" font-size="27" fill="#152C40" text-anchor="start">执行已创建？</text><text x="964" y="441.7" font-size="22" fill="#536779" text-anchor="start">fork / 运行记录</text><line x1="1034" y1="318" x2="1242" y2="318" stroke="#245DD8" stroke-width="3"/><polygon points="1242,318 1231.4690092573155,323.75310646325045 1231.4690092573155,312.24689353674955" fill="#245DD8"/><circle cx="1290" cy="318" r="24" fill="#245DD8"/><text x="1290" y="322.55" font-size="23" fill="white" text-anchor="middle">5</text><text x="1264" y="392.95" font-size="27" fill="#152C40" text-anchor="start">结果已交回？</text><text x="1264" y="441.7" font-size="22" fill="#536779" text-anchor="start">候选 / 验收</text><line x1="815" y1="482" x2="815" y2="550" stroke="#B84B36" stroke-width="2"/><rect x="534" y="550" width="650" height="194" rx="12" fill="#FAEEE9" stroke="none"/><text x="565" y="601.8" font-size="28" fill="#B84B36" text-anchor="start">例：有 running，没有新的 execution</text><text x="565" y="654.25" font-size="25" fill="#152C40" text-anchor="start">先核对显式分派是否发生</text><text x="565" y="691.75" font-size="25" fill="#152C40" text-anchor="start">重复写入任务状态，不能代替创建执行</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">恢复需要动作主体</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">找到停在哪一步，也要找到谁有权、谁有足够信息执行下一步。</text></svg>