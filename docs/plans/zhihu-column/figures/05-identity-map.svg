<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>名字、身份、权限与材料，各自回答一个问题</title><desc>来源：正文所列代码与设计记录；示意图不代表运行测量。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  05</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">机制示意</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">名字、身份、权限与材料，各自回答一个问题</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">同一个 Agent 改名、重启或换任务时，这些关系仍需保持清晰。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文所列代码与设计记录；示意图不代表运行测量。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  05</text><rect x="64" y="270" width="712" height="235" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="270" width="5" height="235" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="305.3" font-size="18" fill="#245DD8" text-anchor="start">识别</text><text x="89" y="353.5" font-size="30" fill="#152C40" text-anchor="start">Identity / 稳定主体</text><text x="89" y="401.4" font-size="24" fill="#536779" text-anchor="start">保存稳定 ID</text><text x="89" y="437.4" font-size="24" fill="#536779" text-anchor="start">显示名可变，历史关联保留</text><rect x="824" y="270" width="712" height="235" rx="12" fill="white" stroke="#D8E1E8"/><rect x="824" y="270" width="5" height="235" rx="0" fill="#087F79" stroke="none"/><text x="849" y="305.3" font-size="18" fill="#087F79" text-anchor="start">授权</text><text x="849" y="353.5" font-size="30" fill="#152C40" text-anchor="start">Member / 组织关系</text><text x="849" y="401.4" font-size="24" fill="#536779" text-anchor="start">记录成员角色与状态</text><text x="849" y="437.4" font-size="24" fill="#536779" text-anchor="start">允许的动作由授权规则决定</text><rect x="64" y="540" width="712" height="235" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="540" width="5" height="235" rx="0" fill="#245DD8" stroke="none"/><text x="89" y="575.3" font-size="18" fill="#245DD8" text-anchor="start">执行</text><text x="89" y="623.5" font-size="30" fill="#152C40" text-anchor="start">Agent / 运行配置</text><text x="89" y="671.4" font-size="24" fill="#536779" text-anchor="start">模型与工作节点等配置</text><text x="89" y="707.4" font-size="24" fill="#536779" text-anchor="start">进程变化不应抹掉业务身份</text><rect x="824" y="540" width="712" height="235" rx="12" fill="white" stroke="#D8E1E8"/><rect x="824" y="540" width="5" height="235" rx="0" fill="#087F79" stroke="none"/><text x="849" y="575.3" font-size="18" fill="#087F79" text-anchor="start">判断</text><text x="849" y="623.5" font-size="30" fill="#152C40" text-anchor="start">上下文 / 本次可见材料</text><text x="849" y="671.4" font-size="24" fill="#536779" text-anchor="start">当前任务、候选与检查记录</text><text x="849" y="707.4" font-size="24" fill="#536779" text-anchor="start">有权限，不等于材料已充分</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">设计判断</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">把识别、授权与信息供给分开核对，才能解释“同一个成员为什么做不了下一步”。</text></svg>