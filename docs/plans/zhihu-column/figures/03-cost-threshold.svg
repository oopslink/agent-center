<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>便宜模型的优势，会被返工逐步吃掉</title><desc>来源：正文假设；C直接 = 10，C路由 = 5 + 10p。不是项目实测价格或失败率。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  03</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">说明性算例</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">便宜模型的优势，会被返工逐步吃掉</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">假设：直接强模型成本 10；路由判断 1，首次执行 4，失败后重做 10。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：正文假设；C直接 = 10，C路由 = 5 + 10p。不是项目实测价格或失败率。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  03</text><line x1="190" y1="735.0" x2="1230" y2="735.0" stroke="#D8E1E8" stroke-width="2"/><text x="160" y="740.4" font-size="24" fill="#536779" text-anchor="end">5</text><line x1="190" y1="507.5" x2="1230" y2="507.5" stroke="#D8E1E8" stroke-width="2"/><text x="160" y="512.9" font-size="24" fill="#536779" text-anchor="end">10</text><line x1="190" y1="280.0" x2="1230" y2="280.0" stroke="#D8E1E8" stroke-width="2"/><text x="160" y="285.4" font-size="24" fill="#536779" text-anchor="end">15</text><text x="190" y="777.55" font-size="23" fill="#536779" text-anchor="middle">0%</text><text x="450.0" y="777.55" font-size="23" fill="#536779" text-anchor="middle">25%</text><text x="710.0" y="777.55" font-size="23" fill="#536779" text-anchor="middle">50%</text><text x="970.0" y="777.55" font-size="23" fill="#536779" text-anchor="middle">75%</text><text x="1230" y="777.55" font-size="23" fill="#536779" text-anchor="middle">100%</text><line x1="190" y1="735" x2="190" y2="280" stroke="#152C40" stroke-width="2"/><line x1="190" y1="735" x2="1230" y2="735" stroke="#152C40" stroke-width="2"/><line x1="190" y1="507.5" x2="1230" y2="507.5" stroke="#245DD8" stroke-width="4"/><line x1="190" y1="735" x2="1230" y2="280" stroke="#087F79" stroke-width="4"/><circle cx="710.0" cy="507.5" r="8" fill="#B84B36"/><text x="1260" y="304.55" font-size="23" fill="#087F79" text-anchor="start">路由后执行</text><text x="1260" y="519.55" font-size="23" fill="#245DD8" text-anchor="start">直接强模型</text><text x="730" y="566.25" font-size="25" fill="#B84B36" text-anchor="start">p = 50%</text><text x="730" y="603.75" font-size="25" fill="#B84B36" text-anchor="start">两者成本持平</text><text x="190" y="258.55" font-size="23" fill="#536779" text-anchor="start">期望成本 / 单位</text><text x="1230" y="815.7" font-size="22" fill="#536779" text-anchor="end">重做概率 p →</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">比较最终交付成本</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">还需纳入人工介入、恢复上下文与等待时间；单次调用便宜并不等于整体节省。</text></svg>