<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><title>一项任务，先后两段承接关系</title><desc>来源：删除前 work_item.go（2b6af1de）；T、W-A、W-B 为说明用编号。</desc><style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1040" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="1040" rx="0" fill="#245DD8" stroke="none"/><text x="64" y="47.3" font-size="18" fill="#245DD8" text-anchor="start">AGENT 协作手记  /  02</text><text x="1536" y="47.3" font-size="18" fill="#536779" text-anchor="end">历史模型</text><text x="64" y="120.4" font-size="44" fill="#152C40" text-anchor="start">一项任务，先后两段承接关系</text><text x="64" y="170.55" font-size="23" fill="#536779" text-anchor="start">Task 保持业务连续性；WorkItem 记录某个 Agent 的处理过程。</text><line x1="64" y1="207" x2="1536" y2="207" stroke="#D8E1E8" stroke-width="1"/><line x1="64" y1="968" x2="1536" y2="968" stroke="#D8E1E8" stroke-width="1"/><text x="64" y="1000.3" font-size="18" fill="#536779" text-anchor="start">来源：删除前 work_item.go（2b6af1de）；T、W-A、W-B 为说明用编号。</text><text x="1536" y="1000.3" font-size="18" fill="#536779" text-anchor="end">agent-center  /  02</text><rect x="64" y="250" width="1472" height="134" rx="12" fill="#EDF3FA" stroke="none"/><text x="96" y="302.2" font-size="32" fill="#245DD8" text-anchor="start">TASK T  ·  修复登录超时</text><text x="96" y="350.25" font-size="25" fill="#152C40" text-anchor="start">目标、任务编号与对话保留；负责人由 A 转为 B</text><line x1="410" y1="384" x2="410" y2="455" stroke="#245DD8" stroke-width="2"/><line x1="1190" y1="384" x2="1190" y2="455" stroke="#245DD8" stroke-width="2"/><rect x="64" y="455" width="650" height="296" rx="12" fill="white" stroke="#D8E1E8"/><rect x="64" y="455" width="5" height="296" rx="0" fill="#087F79" stroke="none"/><text x="89" y="490.3" font-size="18" fill="#087F79" text-anchor="start">分配给 A</text><text x="89" y="538.5" font-size="30" fill="#152C40" text-anchor="start">WorkItem W-A</text><text x="89" y="586.4" font-size="24" fill="#536779" text-anchor="start">排队 → 处理 → 等待回复 → 继续</text><text x="89" y="622.4" font-size="24" fill="#536779" text-anchor="start">同一工作项可以跨多轮交互</text><text x="89" y="658.4" font-size="24" fill="#536779" text-anchor="start">转派后：superseded（被取代）</text><rect x="886" y="455" width="650" height="296" rx="12" fill="white" stroke="#D8E1E8"/><rect x="886" y="455" width="5" height="296" rx="0" fill="#245DD8" stroke="none"/><text x="911" y="490.3" font-size="18" fill="#245DD8" text-anchor="start">转派给 B</text><text x="911" y="538.5" font-size="30" fill="#152C40" text-anchor="start">WorkItem W-B</text><text x="911" y="586.4" font-size="24" fill="#536779" text-anchor="start">新建工作项，从排队开始</text><text x="911" y="622.4" font-size="24" fill="#536779" text-anchor="start">agentID 改为 B</text><text x="911" y="658.4" font-size="24" fill="#536779" text-anchor="start">taskRef 仍然指向任务 T</text><line x1="730" y1="600" x2="870" y2="600" stroke="#245DD8" stroke-width="3"/><polygon points="870,600 859.4690092573155,605.7531064632504 859.4690092573155,594.2468935367496" fill="#245DD8"/><text x="800.0" y="578.7" font-size="22" fill="#245DD8" text-anchor="middle">转派</text><rect x="64" y="830" width="1472" height="106" rx="8" fill="#EAF5F2" stroke="none"/><text x="88" y="869.25" font-size="25" fill="#087F79" text-anchor="start">需要区分的三件事</text><text x="88" y="908.55" font-size="23" fill="#152C40" text-anchor="start">业务任务的连续性、Agent 承接关系的连续性、执行进程的连续性并不相同。</text></svg>